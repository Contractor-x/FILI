<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FILI – Sign Up</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">FILI</a>
    <div id="nav-auth-slot"></div>
  </nav>

  <section class="auth-page">
    <h2>Create Account</h2>
    <form id="signup-form" class="auth-form">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required autocomplete="name" />
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      <p id="error-message" class="error-message" hidden></p>
      <button type="submit" class="auth-btn">Sign Up</button>
    </form>
    <p id="confirm-message" class="confirm-message" hidden>Check your email to confirm your account.</p>
    <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
  </section>

  <script type="module" src="js/pages/signup.js"></script>
</body>
</html>
