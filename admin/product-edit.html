<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FILI – Product Editor</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="logo">FILI Admin</a>
    <div class="nav-right">
      <nav class="admin-nav">
        <a href="index.html">Products</a>
        <a href="categories.html">Categories</a>
      </nav>
      <div id="nav-auth-slot"></div>
    </div>
  </nav>

  <section class="section">
    <div class="admin-toolbar">
      <h2 id="page-title">Add Product</h2>
      <a href="index.html" class="btn btn-outline btn-sm">&larr; Back to products</a>
    </div>

    <p class="form-error" id="error-message"></p>

    <form id="product-form" class="admin-form" novalidate>
      <div class="form-group">
        <label for="name-input">Product name *</label>
        <input type="text" id="name-input" required />
      </div>

      <div class="form-group">
        <label for="slug-input">Slug</label>
        <input type="text" id="slug-input" />
      </div>

      <div class="form-group full-span">
        <label for="description-input">Description</label>
        <textarea id="description-input"></textarea>
      </div>

      <div class="form-group">
        <label for="price-input">Price (₦) *</label>
        <input type="number" id="price-input" min="0" step="0.01" required />
      </div>

      <div class="form-group">
        <label for="compare-input">Compare-at price (optional)</label>
        <input type="number" id="compare-input" min="0" step="0.01" />
      </div>

      <div class="form-group">
        <label for="stock-input">Stock *</label>
        <input type="number" id="stock-input" min="0" step="1" required />
      </div>

      <div class="form-group">
        <label for="category-input">Category</label>
        <select id="category-input"></select>
      </div>

      <div class="form-group full-span">
        <label>Primary image</label>
        <div class="image-upload">
          <img id="image-preview" src="/assets/images/placeholder.png" alt="" />
          <div>
            <input type="file" id="image-input" accept="image/*" />
            <p class="image-note" id="image-note"></p>
          </div>
        </div>
        <input type="hidden" id="image_url_hidden" />
      </div>

      <div class="form-group full-span checkbox-group">
        <input type="checkbox" id="active-input" checked />
        <label for="active-input">Visible on storefront</label>
      </div>

      <div class="form-group full-span">
        <div class="admin-toolbar">
          <h3>Variants</h3>
          <button type="button" class="btn btn-outline btn-sm" id="add-variant-btn">+ Add variant</button>
        </div>
        <div id="variants-wrap"></div>
      </div>

      <div class="form-group full-span">
        <button type="submit" class="btn" id="save-btn">Save Product</button>
      </div>
    </form>
  </section>

  <script type="module" src="../js/pages/admin-product-edit.js"></script>
</body>
</html>
